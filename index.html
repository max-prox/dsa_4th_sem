<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Practice Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#050816] text-white overflow-x-hidden relative p-8">

  <div class="absolute top-[-100px] left-[-100px] w-[500px] h-[500px] rounded-full bg-cyan-400/20 blur-3xl animate-pulse"></div>
  <div class="absolute bottom-[-100px] right-[-100px] w-[500px] h-[500px] rounded-full bg-pink-500/20 blur-3xl animate-pulse"></div>

  <div class="max-w-7xl mx-auto relative z-10">
    <h1 class="text-6xl font-extrabold text-center mb-4 bg-gradient-to-r from-cyan-400 via-pink-500 to-violet-500 text-transparent bg-clip-text">
      DSA Practice Tracker
    </h1>

    <p class="text-center text-gray-300 mb-10 text-lg">
      Neon Animated Dashboard with Persistent Progress
    </p>

    <div class="bg-white/5 backdrop-blur-xl rounded-3xl p-6 border border-cyan-400/20 overflow-hidden">
      <div class="grid grid-cols-[70px_1fr_160px_120px_120px] gap-4 px-6 py-4 text-cyan-300 font-bold text-lg uppercase tracking-wider">
        <div>#</div>
        <div>Question</div>
        <div>LeetCode</div>
        <div>Practice 1</div>
        <div>Practice 2</div>
      </div>

      <div id="questionsContainer" class="space-y-8 mt-4"></div>
    </div>
  </div>

  <script>
    const topics = [
      {
        title: "Array",
        questions: [
          ["Reverse an Array", "https://leetcode.com/problems/reverse-string/"],
          ["Check if Array is Palindrome", "https://leetcode.com/problems/valid-palindrome/"],
          ["Two Sum II (Sorted Array)", "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/"],
          ["Remove Duplicates from Sorted Array", "https://leetcode.com/problems/remove-duplicates-from-sorted-array/"],
          ["Move Zeroes", "https://leetcode.com/problems/move-zeroes/"],
          ["Sum of Subarray of Size K", "https://leetcode.com/problems/subarray-sum-equals-k/"],
          ["Average of Subarray of Size K", "https://leetcode.com/problems/maximum-average-subarray-i/"],
          ["Maximum Element in Subarray of Size K", "https://leetcode.com/problems/sliding-window-maximum/"],
          ["Count Subarrays of Size K", "https://leetcode.com/problems/subarray-sum-equals-k/"]
        ]
      },
      {
        title: "String",
        questions: [
          ["Reverse a String", "https://leetcode.com/problems/reverse-string/"],
          ["Check Palindrome String", "https://leetcode.com/problems/valid-palindrome/"],
          ["Count Vowels and Consonants", "https://leetcode.com/problems/determine-if-string-halves-are-alike/"],
          ["Reverse each word of String", "https://leetcode.com/problems/reverse-words-in-a-string-iii/"],
          ["Reverse Vowels of String", "https://leetcode.com/problems/reverse-vowels-of-a-string/"],
          ["Maximum Vowels in substring of size K", "https://leetcode.com/problems/maximum-number-of-vowels-in-a-substring-of-given-length/"],
          ["Find All Anagrams in a String", "https://leetcode.com/problems/find-all-anagrams-in-a-string/"],
          ["Substring of size three with Distinct Characters", "https://leetcode.com/problems/substrings-of-size-three-with-distinct-characters/"],
          ["Find Common Characters", "https://leetcode.com/problems/find-common-characters/"]
        ]
      },
      {
        title: "Linked List",
        questions: [
          ["Insert at Beginning", "https://leetcode.com/problems/design-linked-list/"],
          ["Insert at End", "https://leetcode.com/problems/design-linked-list/"],
          ["Insert at Position k", "https://leetcode.com/problems/design-linked-list/"],
          ["Delete First Node", "https://leetcode.com/problems/delete-node-in-a-linked-list/"],
          ["Delete Last Node", "https://leetcode.com/problems/remove-linked-list-elements/"],
          ["Search an Element", "https://leetcode.com/problems/search-in-a-binary-search-tree/"],
          ["Reverse a Linked List", "https://leetcode.com/problems/reverse-linked-list/"],
          ["Linked List Cycle", "https://leetcode.com/problems/linked-list-cycle/"],
          ["Count Number of Nodes", "https://leetcode.com/problems/count-complete-tree-nodes/"]
        ]
      },
      {
        title: "Stack & Queues",
        questions: [
          ["Valid Parentheses", "https://leetcode.com/problems/valid-parentheses/"],
          ["Remove All Adjacent Duplicates in String", "https://leetcode.com/problems/remove-all-adjacent-duplicates-in-string/"],
          ["Baseball game(Stack operations)", "https://leetcode.com/problems/baseball-game/"],
          ["Backspace String compare", "https://leetcode.com/problems/backspace-string-compare/"],
          ["Implement Stack using Queues", "https://leetcode.com/problems/implement-stack-using-queues/"],
          ["Maximum Nesting Depth of the Parentheses", "https://leetcode.com/problems/maximum-nesting-depth-of-the-parentheses/"],
          ["Next Greater Element", "https://leetcode.com/problems/next-greater-element-i/"],
          ["Implement Queue using Stack", "https://leetcode.com/problems/implement-queue-using-stacks/"],
          ["Design Circular Deque", "https://leetcode.com/problems/design-circular-deque/"],
        ]
      },
      {
        title: "Tree",
        questions: [
          ["Count Total Nodes in a Binary Tree", "https://leetcode.com/problems/count-complete-tree-nodes/"],
          ["Height (Max Depth) of Binary Tree", "https://leetcode.com/problems/maximum-depth-of-binary-tree/"],
          ["Print Preorder Traversal", "https://leetcode.com/problems/binary-tree-preorder-traversal/"],
          ["Print Postorder Traversal", "https://leetcode.com/problems/binary-tree-postorder-traversal/"],
          ["Print Inorder Traversal", "https://leetcode.com/problems/binary-tree-inorder-traversal/"],
          ["Symmetric Tree", "https://leetcode.com/problems/symmetric-tree/"],
          ["Cousins in Binary Tree", "https://leetcode.com/problems/cousins-in-binary-tree/"],
          ["Binary Tree Level Order traversal", "https://leetcode.com/problems/binary-tree-level-order-traversal/"],
          ["Find Maximum & Minimum Value in Tree", "https://leetcode.com/problems/validate-binary-search-tree/"],
          ["Diameter of Binary tree", "https://leetcode.com/problems/diameter-of-binary-tree/"]
        ]
      },
      {
        title: "Graph",
        questions: [
          ["BFS Traversal of Graph", "https://leetcode.com/problems/find-if-path-exists-in-graph/"],
          ["DFS Traversal of Graph", "https://leetcode.com/problems/keys-and-rooms/"],
          ["Count number of connected components", "https://leetcode.com/problems/number-of-connected-components-in-an-undirected-graph/"]
        ]
      },
      {
        title: "Recursion",
        questions: [
          ["Power of Two", "https://leetcode.com/problems/power-of-two/"],
          ["Reverse Linked List", "https://leetcode.com/problems/reverse-linked-list/"]
        ]
      }
    ];

    function saveCheckbox(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getCheckbox(key) {
      return JSON.parse(localStorage.getItem(key) || 'false');
    }

    const container = document.getElementById('questionsContainer');

    topics.forEach((topic, topicIndex) => {
      const topicDiv = document.createElement('div');

      let html = `
        <div class="mb-3 rounded-2xl bg-gradient-to-r from-cyan-500/20 to-pink-500/20 px-6 py-4 border border-cyan-400/20">
          <h2 class="text-3xl font-bold text-cyan-300">
            ${topic.title}
          </h2>
        </div>
      `;

      topic.questions.forEach((q, i) => {
        html += `
          <div class="grid grid-cols-[70px_1fr_160px_120px_120px] gap-4 items-center px-6 py-4 rounded-2xl bg-white/[0.03] hover:bg-cyan-400/10 transition-all duration-300 mb-2">
            <div class="text-pink-400 font-bold text-lg">${topicIndex + 1}.${i + 1}</div>

            <div class="text-white text-lg">${q[0]}</div>

            <a href="${q[1]}" target="_blank" class="inline-flex items-center justify-center px-4 py-2 rounded-xl bg-cyan-400/10 border border-cyan-400/30 text-cyan-300">
              Open Link
            </a>

            <div>
              <input type="checkbox"
                ${getCheckbox(`${topic.title}-${i}-p1`) ? 'checked' : ''}
                onchange="saveCheckbox('${topic.title}-${i}-p1', this.checked)">
            </div>

            <div>
              <input type="checkbox"
                ${getCheckbox(`${topic.title}-${i}-p2`) ? 'checked' : ''}
                onchange="saveCheckbox('${topic.title}-${i}-p2', this.checked)">
            </div>
          </div>
        `;
      });

      topicDiv.innerHTML = html;
      container.appendChild(topicDiv);
    });
  </script>
</body>
</html>
